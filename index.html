<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interaktive Referenz und Trainer fuer franzoesische Grammatik: Verben, Genre &amp; Nombre, Adjektive, Adjektiv-Stellung, Steigerung.">
<meta name="theme-color" content="#232838">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128216;</text></svg>">

<style>
/* Basis-Reset (im Artifact liefert das die Plattform, hier machen wir es selbst) */
:root{color-scheme:light;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark;} }
:root[data-theme="dark"]{color-scheme:dark;}
:root[data-theme="light"]{color-scheme:light;}
html,body{margin:0; padding:0;}
img{max-width:100%;}
[hidden]{display:none !important;}
</style>
<title>Cahier de Grammaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* ============ TOKENS ============ */
:root{
  --ink:#232838;
  --ink-soft:#5b6178;
  --ink-faint:#8b8f9f;
  --paper:#F3F0E6;
  --paper-raised:#FFFEF9;
  --paper-sunken:#EAE6D8;
  --rule:#D9D2BE;
  --rule-strong:#C7BEA3;
  --accent:#B5342C;
  --accent-ink:#ffffff;
  --accent-soft:#F4E0DD;
  --good:#2E7D5B;
  --good-soft:#DEEFE6;
  --gold:#93690E;
  --gold-soft:#F3E7CC;
  --focus:#2159C9;
  --shadow: 0 1px 2px rgba(35,40,56,0.06), 0 6px 20px -8px rgba(35,40,56,0.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECE9DE;
    --ink-soft:#ABAFC4;
    --ink-faint:#767a8c;
    --paper:#1B1C22;
    --paper-raised:#232530;
    --paper-sunken:#15161B;
    --rule:#383A46;
    --rule-strong:#484B5A;
    --accent:#E28880;
    --accent-ink:#241012;
    --accent-soft:#3A2426;
    --good:#7BCBA6;
    --good-soft:#1D3128;
    --gold:#D9B65B;
    --gold-soft:#332911;
    --focus:#7FA6F2;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --ink:#ECE9DE;
  --ink-soft:#ABAFC4;
  --ink-faint:#767a8c;
  --paper:#1B1C22;
  --paper-raised:#232530;
  --paper-sunken:#15161B;
  --rule:#383A46;
  --rule-strong:#484B5A;
  --accent:#E28880;
  --accent-ink:#241012;
  --accent-soft:#3A2426;
  --good:#7BCBA6;
  --good-soft:#1D3128;
  --gold:#D9B65B;
  --gold-soft:#332911;
  --focus:#7FA6F2;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
}

/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Newsreader',Georgia,serif; text-wrap:balance; margin:0; color:var(--ink);}
p{margin:0 0 .8em 0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

/* ============ APP SHELL ============ */
.app{
  display:flex;
  min-height:100vh;
  max-width:1180px;
  margin:0 auto;
}
.sidebar{
  flex:0 0 232px;
  background:var(--ink);
  color:var(--paper);
  display:flex;
  flex-direction:column;
  padding:26px 20px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
.brand-mark{
  font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:26px;
  width:38px;height:38px;border-radius:50%;
  background:var(--accent); color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.brand-title{font-family:'Newsreader',serif; font-style:italic; font-size:19px; line-height:1.15; color:var(--paper);}
.brand-title b{font-style:normal; font-weight:600;}

.nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:baseline; gap:10px;
  padding:9px 10px; border-radius:5px;
  background:none; border:none; color:var(--paper); opacity:.68;
  font-size:14.5px; text-align:left; cursor:pointer;
  font-family:'Public Sans',sans-serif;
}
.nav-item .num{font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.7; width:16px; flex:0 0 auto;}
.nav-item:hover{opacity:1; background:rgba(255,255,255,0.06);}
.nav-item.active{opacity:1; background:rgba(255,255,255,0.1); font-weight:600;}
.nav-item .stat{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.6;}
/* Rücksprung zur Fach-Wahl — durch die Linie vom Inhalt des Fachs getrennt. */
.nav-item.nav-back{opacity:.7; margin-bottom:8px; padding-bottom:11px; border-bottom:1px solid rgba(255,255,255,0.13);}
.nav-item.nav-back:hover{opacity:1;}

.sidebar-foot{border-top:1px solid rgba(255,255,255,0.14); padding-top:16px; margin-top:12px; font-size:12.5px; opacity:.85;}
.sidebar-foot .row{display:flex; justify-content:space-between; margin-bottom:6px;}
.bar-track{height:5px; background:rgba(255,255,255,0.16); border-radius:3px; overflow:hidden; margin:8px 0 12px 0;}
.bar-fill{height:100%; background:var(--accent); border-radius:3px;}
.ghost-btn{
  width:100%; padding:7px 10px; border-radius:5px; border:1px solid rgba(255,255,255,0.25);
  background:transparent; color:var(--paper); font-size:12.5px; cursor:pointer;
}
.ghost-btn:hover{background:rgba(255,255,255,0.08);}

.main{flex:1; min-width:0; position:relative; padding:0 0 36px 0;}
.content{max-width:760px; margin:0 auto; padding:40px 44px 40px 58px; position:relative;}
.page-rule-line{
  position:absolute; left:34px; top:0; bottom:0; width:1px; background:var(--rule-strong);
  pointer-events:none;
}
.content::before{
  content:"";
  position:absolute; left:0; right:0; top:0; height:100%;
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  opacity:.35; pointer-events:none; z-index:0;
}
.content > *{position:relative; z-index:1;}

/* ============ TOPBAR + SCRIM (nur mobil sichtbar) ============ */
.topbar{display:none;}
.scrim{display:none;}
.drawer-close{display:none;}

/* ============ TYPE ============ */
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent); font-weight:600; margin-bottom:6px; display:block;
}
.page-title{font-size:32px; font-weight:600; margin-bottom:6px;}
.page-lede{color:var(--ink-soft); font-size:15.5px; max-width:56ch; margin-bottom:28px;}
.section-title{font-size:21px; font-weight:600; margin:36px 0 4px 0;}
.section-lede{color:var(--ink-soft); font-size:14px; margin-bottom:14px; max-width:60ch;}

/* ============ CARDS & GRID ============ */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px;
  padding:16px 18px;
}
.card h4{font-size:14.5px; font-weight:600; margin-bottom:4px; font-family:'Public Sans',sans-serif;}
.card .ex{color:var(--ink-soft); font-size:13.5px; font-family:'IBM Plex Mono',monospace; line-height:1.7;}

.topic-card{
  display:flex; gap:14px; align-items:flex-start; text-align:left;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px;
  padding:16px 18px; cursor:pointer; width:100%;
}
.topic-card:hover{border-color:var(--rule-strong); box-shadow:var(--shadow);}
.topic-card .badge{
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
  width:30px; height:30px; border-radius:50%; flex:0 0 auto;
  background:var(--paper-sunken); color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
}
.topic-card h4{margin-bottom:2px;}
.topic-card p{margin:0; color:var(--ink-soft); font-size:13.5px;}
.topic-card .chip{margin-top:8px;}

.chip{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 8px; border-radius:20px;
  background:var(--paper-sunken); color:var(--ink-soft);
}
.chip.exc{background:var(--accent-soft); color:var(--accent);}
.chip.ok{background:var(--good-soft); color:var(--good);}
.chip.gold{background:var(--gold-soft); color:var(--gold);}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ============ TABLES ============ */
.tablewrap{overflow-x:auto; border:1px solid var(--rule); border-radius:6px; margin:10px 0 18px 0;}
table{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--paper-raised);}
th{
  background:var(--paper-sunken); color:var(--ink-soft); text-align:left; padding:8px 10px;
  font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
  white-space:nowrap; border-bottom:1px solid var(--rule);
}
td{padding:7px 10px; border-bottom:1px solid var(--rule); vertical-align:top; font-family:'IBM Plex Mono',monospace; font-size:13px;}
tr:last-child td{border-bottom:none;}
td.exc, .exc-form{color:var(--accent); font-weight:600;}
td.person{font-family:'Public Sans',sans-serif; color:var(--ink-soft); font-weight:500; white-space:nowrap;}
td.dot-yes{color:var(--accent); text-align:center;}
td.dot-no{color:var(--ink-faint); text-align:center; opacity:.5;}

/* ============ VERB LIST ============ */
.verb-list{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
.verb-row{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px;
  padding:10px 14px; cursor:pointer;
}
.verb-row:hover{border-color:var(--rule-strong);}
.verb-row .inf{font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:17px; width:100px; flex:0 0 auto;}
.verb-row .de{color:var(--ink-soft); font-size:13px; flex:1;}
.verb-row .excdots{display:flex; gap:3px;}
.verb-row .excdots span{width:6px;height:6px;border-radius:50%; background:var(--rule-strong);}
.verb-row .excdots span.on{background:var(--accent);}
.group-label{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-faint); margin:22px 0 8px 0;
}
.verb-detail{background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:6px; padding:16px 18px; margin-bottom:14px;}
.verb-detail .vd-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; flex-wrap:wrap;}
.verb-detail .vd-head h3{font-size:20px;}
.verb-note{background:var(--gold-soft); border-left:3px solid var(--gold); border-radius:0 4px 4px 0; padding:8px 12px; font-size:13px; color:var(--ink); margin-top:8px;}
.verb-note.warn{background:var(--accent-soft); border-left-color:var(--accent);}
.back-link{background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; display:inline-flex; align-items:center; gap:4px;}
.back-link:hover{color:var(--ink);}

/* ============ CONTROLS ============ */
.controls-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.toggle{
  padding:6px 12px; border-radius:20px; border:1px solid var(--rule-strong);
  background:var(--paper-raised); color:var(--ink-soft); font-size:12.5px; cursor:pointer;
}
.toggle.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.searchbox{
  flex:1; min-width:160px; padding:8px 12px; border-radius:20px; border:1px solid var(--rule-strong);
  background:var(--paper-raised); color:var(--ink); font-size:13.5px; font-family:inherit;
}

/* ============ QUIZ ============ */
.quiz-panel{
  background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:8px;
  padding:24px 26px; box-shadow:var(--shadow); margin-top:10px; position:relative; overflow:hidden;
}
.quiz-panel::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent);}
.quiz-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);}
.quiz-score{font-family:'IBM Plex Mono',monospace; font-weight:600;}
.quiz-prompt-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px;}
.quiz-prompt{font-size:19px; margin-bottom:16px; font-weight:500;}
.quiz-prompt .hint{color:var(--ink-soft); font-weight:400; font-size:14px; display:block; margin-top:4px;}
.quiz-input-row{display:flex; gap:10px; margin-bottom:6px;}
.quiz-input{
  flex:1; padding:12px 14px; border-radius:6px; border:1.5px solid var(--rule-strong);
  background:var(--paper); color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:16px;
}
.quiz-input:focus{border-color:var(--focus);}
.quiz-input.correct{border-color:var(--good); background:var(--good-soft);}
.quiz-input.wrong{border-color:var(--accent); background:var(--accent-soft);}
.btn{
  padding:11px 20px; border-radius:6px; border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn:hover{opacity:.88;}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--rule-strong);}
.btn.accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.mc-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.mc-btn{
  padding:11px 18px; border-radius:6px; border:1.5px solid var(--rule-strong); background:var(--paper);
  color:var(--ink); font-size:14.5px; cursor:pointer; font-family:inherit;
}
.mc-btn:hover{border-color:var(--ink-soft);}
.mc-btn.correct{background:var(--good-soft); border-color:var(--good); color:var(--good);}
.mc-btn.wrong{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.feedback{margin-top:12px; padding:12px 14px; border-radius:6px; font-size:13.5px; display:none;}
.feedback.show{display:block;}
.feedback.correct{background:var(--good-soft); color:var(--good);}
.feedback.wrong{background:var(--accent-soft); color:var(--accent);}
.feedback .answer{font-family:'IBM Plex Mono',monospace; font-weight:600;}
.feedback .explain{color:var(--ink); opacity:.85; margin-top:4px; font-size:13px;}
.quiz-actions{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}

.exam-summary{background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:8px; padding:22px; margin-top:16px;}
.exam-summary .big{font-family:'Newsreader',serif; font-size:44px; font-weight:600;}
.cat-bar-row{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px;}
.cat-bar-row .label{width:150px; flex:0 0 auto; color:var(--ink-soft);}
.cat-bar-track{flex:1; height:8px; background:var(--paper-sunken); border-radius:4px; overflow:hidden;}
.cat-bar-fill{height:100%; background:var(--good);}
.cat-bar-row .frac{width:44px; text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); flex:0 0 auto;}

.callout{border-radius:6px; padding:12px 16px; font-size:13.5px; margin:14px 0;}
.callout.tip{background:var(--gold-soft); border-left:3px solid var(--gold);}
.callout.warn{background:var(--accent-soft); border-left:3px solid var(--accent);}
.callout.ok{background:var(--good-soft); border-left:3px solid var(--good);}

.home-hero{margin-bottom:8px;}
.home-stats{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 30px 0;}
.stat-tile{background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px; padding:12px 16px; flex:1; min-width:120px;}
.stat-tile .n{font-family:'Newsreader',serif; font-size:26px; font-weight:600; display:block;}
.stat-tile .l{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

/* ============ TEXT-HILFSKLASSEN ============ */
.muted{color:var(--ink-faint);}
td.sans, .sans{font-family:'Public Sans',sans-serif;}
td.b, .b{font-weight:600;}
th.th-exc{color:var(--accent);}
.th-sub{display:block; font-weight:400; text-transform:none; letter-spacing:0; font-size:11px; opacity:.75;}
.link-btn{background:none; border:none; color:var(--ink-faint); font-size:12.5px; cursor:pointer; padding:0; font-family:inherit;}
.link-btn:hover{color:var(--accent);}

/* ============ LEVEL / XP ============ */
.lvl-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;}
.lvl-badge{background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:1px 7px;
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;}
.level-card{background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:8px; padding:18px 20px; margin:18px 0 8px 0;}
.level-card .lc-left{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.level-card .lc-lv{font-family:'Newsreader',serif; font-size:24px; font-weight:600;}
.level-card .lc-xp{font-size:13px; color:var(--ink-soft);}
.level-card .lc-bar{height:8px; background:var(--paper-sunken); border-radius:4px; overflow:hidden;}
.level-card .lc-bar i{display:block; height:100%; background:var(--accent);}
.level-card .lc-stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:13px; color:var(--ink-soft);}
.level-card .lc-stats b{color:var(--ink); font-size:14px;}
.level-card .lc-stats span + span{border-left:1px solid var(--rule); padding-left:14px;}

/* ============ MODUS-KARTEN ============ */
.mode-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0 18px 0;}
@media (max-width:640px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px; padding:16px 18px; cursor:pointer;}
.mode-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
.mode-card .mc-icon{width:22px; height:22px; color:var(--accent);}
.mode-card .mc-icon svg{width:100%; height:100%; display:block;}
.mode-card .mc-title{font-family:'Public Sans',sans-serif; font-weight:600; font-size:15px;}
.mode-card .mc-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}

/* ============ KONFIG-PANEL ============ */
.config-panel{background:var(--paper-sunken); border:1px solid var(--rule); border-radius:6px; padding:14px 16px; margin-bottom:14px;}
.cfg-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink-faint); margin:0 0 8px 0;}
.config-panel .cfg-label:not(:first-child){margin-top:14px;}
.chip-row{display:flex; gap:7px; flex-wrap:wrap;}
.chip-btn{padding:5px 11px; border-radius:20px; border:1px solid var(--rule-strong); background:var(--paper-raised);
  color:var(--ink-soft); font-size:12.5px; cursor:pointer; font-family:inherit;}
.chip-btn:hover{border-color:var(--ink-soft);}
.chip-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.chip-btn .x{opacity:.7; margin-left:3px;}

/* ============ SESSION-METER ============ */
.meter-row{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
.meter-label b{color:var(--ink);}
.meter-bar{flex:1; min-width:70px; height:5px; background:var(--paper-sunken); border-radius:3px; overflow:hidden;}
.meter-bar i{display:block; height:100%; background:var(--accent); transition:width .25s linear;}
.meter-score{font-weight:600; color:var(--ink);}
.timer{font-size:17px; font-weight:600; color:var(--ink);}
.timer.low{color:var(--accent);}
.hearts{display:flex; gap:4px;}
.hearts .heart{width:16px; height:16px; color:var(--accent);}
.hearts .heart svg{width:100%; height:100%; display:block;}
.hearts .heart.off{color:var(--rule-strong);}
.combo-chip{display:inline-flex; align-items:center; gap:4px; background:var(--gold-soft); color:var(--gold);
  border-radius:20px; padding:2px 9px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;}
.combo-chip svg{width:12px; height:12px;}

/* ============ FRAGE ============ */
.q-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
.q-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.q-hint{font-size:13.5px; color:var(--ink-soft); margin:-8px 0 16px 0;}
.quiz-prompt i{font-family:'Newsreader',serif; font-style:italic; font-weight:600;}
.fb-head{display:flex; justify-content:space-between; align-items:center; gap:10px; font-weight:600; margin-bottom:4px;}
.xp-pop{font-size:12px; font-weight:600;}
.feedback .answer{display:block; font-family:'IBM Plex Mono',monospace; font-weight:600; margin-top:2px;}

/* ============ ERGEBNIS ============ */
.result-panel{background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:8px; padding:24px 26px; box-shadow:var(--shadow);}
.result-top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.result-score{font-family:'Newsreader',serif; font-size:42px; font-weight:600; line-height:1.1;}
.stars{display:flex; gap:5px;}
.stars .star{width:24px; height:24px; color:var(--gold);}
.stars .star svg{width:100%; height:100%; display:block;}
.stars .star.off{color:var(--rule);}
.result-meta{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--ink-soft); align-items:center;}
.result-meta b{color:var(--ink);}
.result-bars{margin-top:16px;}
.result-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

/* ============ KORREKTUR-LISTE ============ */
.review-list{border-top:1px solid var(--rule);}
.review-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--rule);}
.review-item .ri-num{flex:0 0 24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600;}
.review-item.ok .ri-num{background:var(--good-soft); color:var(--good);}
.review-item .ri-body{flex:1; min-width:0;}
.review-item .ri-prompt{font-size:13.5px; margin-bottom:4px;}
.review-item .ri-answers{display:flex; flex-direction:column; gap:2px;}
.ra{font-family:'IBM Plex Mono',monospace; font-size:13px;}
.ra.bad{color:var(--accent); text-decoration:line-through;}
.ra.good{color:var(--good); font-weight:600;}
.ri-explain{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

/* ============ BAGS + BEDEUTUNGSTABELLE ============ */
.bags-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:12px 0 6px 0;}
@media (max-width:640px){.bags-grid{grid-template-columns:1fr;}}
.bags-card{background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px; padding:14px 16px;}
.bags-card h4{font-family:'Public Sans',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--accent); margin-bottom:8px;}
table.mini{background:none;}
table.mini td{border:none; padding:2px 10px 2px 0; font-size:13.5px;}
table.mini td.b{font-family:'IBM Plex Mono',monospace; font-weight:600;}
.mc-table td.fig{background:var(--accent-soft);}
.mc-table th.th-fig{background:var(--accent-soft); color:var(--accent);}

/* ============ STEIGERUNG ============ */
.comp-card{position:relative; padding-top:20px;}
.comp-card .sign{position:absolute; top:12px; right:14px; font-family:'IBM Plex Mono',monospace; font-weight:600;
  font-size:15px; color:var(--accent);}
.comp-card .formula{font-family:'IBM Plex Mono',monospace; font-size:12.5px; background:var(--paper-sunken);
  border-radius:4px; padding:5px 9px; display:inline-block; margin:2px 0 8px 0;}
.comp-card .mini-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px; border-top:1px dashed var(--rule); padding-top:7px;}
.comp-card .mini-note b{font-family:'IBM Plex Mono',monospace;}
.prompt-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
@media (max-width:640px){.prompt-grid{grid-template-columns:1fr;}}
.prompt-chip{background:var(--paper-raised); border:1px solid var(--rule); border-radius:6px; padding:8px 12px; font-size:13px;}
.prompt-chip .mono{color:var(--accent); margin-right:7px; font-size:11.5px;}

/* ============ ZEITSTRAHL ============ */
/* Die Achse nimmt die Randlinie des Heftblatts auf; die Jahreszahlen
   hängen als Anker links davon. */
.timeline{position:relative; margin:14px 0 18px 0; padding-left:62px;}
.timeline::before{
  content:""; position:absolute; left:52px; top:6px; bottom:6px;
  width:1px; background:var(--rule-strong);
}
.tl-item{position:relative; padding:0 0 18px 0;}
.tl-item::before{
  content:""; position:absolute; left:-14px; top:7px;
  width:7px; height:7px; border-radius:50%;
  background:var(--accent); border:2px solid var(--paper);
}
.tl-item.fuzzy::before{background:var(--rule-strong);}
.tl-year{
  position:absolute; left:-62px; top:2px; width:48px; text-align:right;
  font-size:13px; font-weight:600; color:var(--ink);
}
.tl-item.fuzzy .tl-year{color:var(--ink-faint); font-weight:500;}
.tl-body h4{font-family:'Public Sans',sans-serif; font-size:14.5px; font-weight:600; margin-bottom:2px;}
.tl-body p{margin:0; font-size:13.5px; color:var(--ink-soft);}

/* ============ FACH-WAHL ============ */
.subject-grid{display:grid; gap:12px; margin:18px 0 8px 0;}
.subject-card{
  display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:8px;
  padding:18px 20px; cursor:pointer; font-family:inherit; color:var(--ink);
}
.subject-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
.sc-mark{
  font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:24px;
  width:44px; height:44px; border-radius:50%; flex:0 0 auto;
  background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center;
}
.sc-body{display:flex; flex-direction:column; gap:2px; min-width:0;}
.sc-title{font-family:'Newsreader',serif; font-size:19px; font-weight:600;}
.sc-sub{font-size:13.5px; color:var(--ink-soft);}
.sc-stat{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

/* ============ KOLOPHON ============ */
/* An der Textspalte ausgerichtet wie der Rest der Seite, unterhalb des
   linierten Bereichs — der Fuss des Heftblatts. */
.site-foot{max-width:760px; margin:0 auto; padding:12px 44px 0 58px;}
.site-foot .colophon{
  display:flex; align-items:center; gap:5px;
  margin:0; padding-top:15px;
  border-top:1px solid var(--rule);
  font-size:12.5px; color:var(--ink-faint);
}
.site-foot b{font-weight:600; color:var(--ink-soft);}
.site-foot .fh{width:12px; height:12px; color:var(--accent); flex:0 0 auto;}
.site-foot .fh svg{width:100%; height:100%; display:block;}

/* ============ MOBILE ============ */

@media (max-width: 860px){
  .app{flex-direction:column; max-width:none;}

  /* --- Kopfleiste: Menütaste, aktueller Abschnitt, Level --- */
  .topbar{
    display:flex; align-items:center; gap:8px;
    position:sticky; top:0; z-index:40;
    background:var(--ink); color:var(--paper);
    border-bottom:1px solid rgba(255,255,255,0.13);
    padding:5px 10px;
    padding-top:calc(5px + env(safe-area-inset-top));
    padding-left:calc(10px + env(safe-area-inset-left));
    padding-right:calc(10px + env(safe-area-inset-right));
  }
  .menu-btn{
    width:44px; height:44px; flex:0 0 auto; margin-left:-6px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:8px; cursor:pointer; color:var(--paper);
  }
  .menu-btn:active{background:rgba(255,255,255,0.1);}
  /* Drei Striche wie die Linien im Heft */
  .menu-btn .bars{display:block; width:19px; height:14px; position:relative;}
  .menu-btn .bars i{position:absolute; left:0; right:0; height:1.5px; border-radius:2px; background:currentColor;}
  .menu-btn .bars i:nth-child(1){top:0;}
  .menu-btn .bars i:nth-child(2){top:6.25px;}
  .menu-btn .bars i:nth-child(3){top:12.5px;}

  .topbar-title{
    flex:1; min-width:0; font-family:'Newsreader',Georgia,serif; font-size:17px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .topbar-lv{
    flex:0 0 auto; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:4px;
    background:var(--accent); color:var(--accent-ink);
  }

  /* --- Sidebar wird zur Schublade --- */
  .scrim{
    display:block; position:fixed; inset:0; z-index:50;
    background:rgba(12,13,17,0.55);
    opacity:0; pointer-events:none; transition:opacity .28s ease;
  }
  body.nav-open .scrim{opacity:1; pointer-events:auto;}

  .sidebar{
    position:fixed; top:0; left:0; bottom:0; z-index:60;
    flex:0 0 auto; width:min(300px, 86vw); height:100%; height:100dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
    padding-top:calc(20px + env(safe-area-inset-top));
    transform:translateX(-102%); visibility:hidden;
    transition:transform .28s cubic-bezier(.4,0,.2,1), visibility 0s linear .28s;
  }
  body.nav-open .sidebar{
    transform:translateX(0); visibility:visible;
    box-shadow:0 0 44px rgba(0,0,0,0.45);
    transition:transform .28s cubic-bezier(.4,0,.2,1), visibility 0s;
  }
  body.nav-open{overflow:hidden;}

  .brand{margin-bottom:22px;}
  .drawer-close{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; margin-left:auto; margin-right:-8px; flex:0 0 auto;
    background:none; border:none; border-radius:8px; color:var(--paper); opacity:.65; cursor:pointer;
  }
  .drawer-close:active{background:rgba(255,255,255,0.1); opacity:1;}
  .drawer-close svg{width:17px; height:17px; display:block;}
  .nav-item{padding:12px 12px; border-radius:8px; font-size:16px;}
  .sidebar-foot{font-size:13px; padding-top:18px;}
  .ghost-btn{padding:11px 10px; font-size:13px;}

  /* --- Inhalt --- */
  .main{padding-bottom:26px;}
  .site-foot{
    padding:8px 16px 0 28px;
    padding-left:calc(28px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
    padding-bottom:env(safe-area-inset-bottom);
  }
  .content{
    padding:22px 16px 22px 28px;
    padding-left:calc(28px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  .page-rule-line{left:calc(13px + env(safe-area-inset-left));}
  .page-title{font-size:27px;}
  .page-lede{font-size:15px; margin-bottom:22px;}
  .section-title{font-size:19px; margin-top:30px;}

  /* --- Tabellen: Personenspalte bleibt beim Querscrollen stehen --- */
  .tablewrap{-webkit-overflow-scrolling:touch;}
  th,td{padding:8px 9px;}
  .conj th:first-child, .conj td.person{
    position:sticky; left:0; z-index:2;
    border-right:1px solid var(--rule);
  }
  .conj td.person{background:var(--paper-raised);}
  .conj th:first-child{background:var(--paper-sunken); z-index:3;}

  /* --- Grössere Tippflächen --- */
  .toggle,.chip-btn{padding:9px 15px; font-size:13.5px;}
  .btn{padding:13px 20px; font-size:15px;}
  .searchbox{font-size:16px; padding:10px 14px;}
  .topic-card,.verb-row{padding:14px 15px;}
  .link-btn{padding:4px 0; font-size:13px;}

  /* --- Quiz: Antworten untereinander, volle Breite --- */
  /* Genug Raum unter der Übung, damit sie beim Start ganz nach oben scrollt
     und nicht am Dokumentende hängen bleibt. */
  #sessionHost:not(:empty){min-height:78vh; min-height:calc(100dvh - 130px);}
  .quiz-panel{padding:18px 16px;}
  .quiz-prompt{font-size:18px;}
  .quiz-input-row{flex-direction:column; gap:8px;}
  .quiz-input-row .btn{width:100%;}
  .mc-row{flex-direction:column; gap:8px;}
  .mc-btn{width:100%; text-align:left; padding:14px 16px;}
  .quiz-actions{gap:10px;}

  /* --- Zeitstrahl: schmalere Jahresspalte --- */
  .timeline{padding-left:52px;}
  .timeline::before{left:44px;}
  .tl-year{left:-52px; width:40px; font-size:12px;}

  /* --- Auswertung --- */
  .cat-bar-row{flex-wrap:wrap; row-gap:3px;}
  .cat-bar-row .label{flex:1 1 100%; width:auto;}
  .result-panel{padding:20px 16px;}
  .result-actions .btn{flex:1 1 auto;}
}

@media (max-width: 420px){
  .home-stats{gap:8px;}
  .stat-tile{min-width:calc(50% - 4px); padding:11px 13px;}
  .level-card{padding:15px 16px;}
  .level-card .lc-stats span + span{border-left:none; padding-left:0;}
}

</style>

<div class="app">

      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>

var PERSONS = ["je","tu","il/elle/on","nous","vous","ils/elles"];

    pq:["avais lancé","avais lancé","avait lancé","avions lancé","aviez lancé","avaient lancé"],

  manger: V("manger","essen",{
    pr:["mange","manges","mange","mangeons","mangez","mangent"],
    im:["mangeais","mangeais","mangeait","mangions","mangiez","mangeaient"],
    pc:["ai mangé","as mangé","a mangé","avons mangé","avez mangé","ont mangé"],
    pq:["avais mangé","avais mangé","avait mangé","avions mangé","aviez mangé","avaient mangé"],
    fu:["mangerai","mangeras","mangera","mangerons","mangerez","mangeront"],
    co:["mangerais","mangerais","mangerait","mangerions","mangeriez","mangeraient"]
  },{pr:1,im:1}, "Zusätzliches e nur vor a/o (weicher „g“-Klang) — nie vor e/i."),

  acheter: V("acheter","kaufen",{
    pr:["achète","achètes","achète","achetons","achetez","achètent"],
    im:["achetais","achetais","achetait","achetions","achetiez","achetaient"],
    pc:["ai acheté","as acheté","a acheté","avons acheté","avez acheté","ont acheté"],
    pq:["avais acheté","avais acheté","avait acheté","avions acheté","aviez acheté","avaient acheté"],
    fu:["achèterai","achèteras","achètera","achèterons","achèterez","achèteront"],
    co:["achèterais","achèterais","achèterait","achèterions","achèteriez","achèteraient"]
  },{pr:1,fu:1,co:1}, "è nie bei nous/vous im Présent — aber in Futur/Cond. immer."),

  esperer: V("espérer","hoffen",{
    pr:["espère","espères","espère","espérons","espérez","espèrent"],
    im:["espérais","espérais","espérait","espérions","espériez","espéraient"],
    pc:["ai espéré","as espéré","a espéré","avons espéré","avez espéré","ont espéré"],
    pq:["avais espéré","avais espéré","avait espéré","avions espéré","aviez espéré","avaient espéré"],
    fu:["espérerai","espéreras","espérera","espérerons","espérerez","espéreront"],
    co:["espérerais","espérerais","espérerait","espérerions","espéreriez","espéreraient"]

   ================================================================ */
function norm(s){
  if(s==null) return "";
  return String(s).toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[’‘`]/g,"'")
    .replace(/\s+/g," ")
    .trim();
}
function startsVowelSound(s){ return /^[aeiouhàâäéèêëîïôöùûü]/i.test(s); }
/* haïr has an h aspiré: no elision, ever (je hais — not j'hais). It's the
   only h-initial verb in this set, so a verb-key check is enough. */
function pronounForm(personIdx, form, noElision){
  if(personIdx===0){
    return (!noElision && startsVowelSound(form)) ? "j'"+form : "je "+form;
  }
  var labels = ["","tu","il/elle/on","nous","vous","ils/elles"];
  return labels[personIdx] + " " + form;
}
function cellArr(cell){ return Array.isArray(cell) ? cell.slice() : [cell]; }
/* For persons other than je, accept the bare verb form AND any one of the
   valid pronouns in front of it — il/elle/on only needs ONE of the three. */
var PRONOUN_ACCEPT = [null, ["tu"], ["il","elle","on"], ["nous"], ["vous"], ["ils","elles"]];
function acceptableFor(personIdx, cell, noElision){
  var base = cellArr(cell);
  var out = [];
  base.forEach(function(f){
    out.push(f);
    if(personIdx===0){
      if(!noElision && startsVowelSound(f)) out.push("j'"+f);
      out.push("je "+f);
    } else {
      PRONOUN_ACCEPT[personIdx].forEach(function(pr){ out.push(pr+" "+f); });
    }
  });
  return out;
}
function checkAnswer(userInput, personIdx, cell, noElision){
  var accept = acceptableFor(personIdx, cell, noElision).map(norm);
  return accept.indexOf(norm(userInput)) !== -1;
}
function displayForm(personIdx, cell, noElision){
  return cellArr(cell).map(function(f){ return pronounForm(personIdx, f, noElision); }).join(" / ");
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function defaultStore(){
  return {xp:0, byTopic:{}, verbsSeen:{}, best:{}, lastDay:"", today:{correct:0,total:0}};
}
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw), d = defaultStore(), k;
      for(k in d){ if(!(k in s)) s[k] = d[k]; }
      return s;
    }
  }catch(e){}
  return defaultStore();
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE.store)); }catch(e){} }
function todayKey(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function levelInfo(){
  var xp = STATE.store.xp || 0;
  var into = xp % XP_PER_LEVEL;
  return {level: Math.floor(xp/XP_PER_LEVEL)+1, into:into, need:XP_PER_LEVEL, pct: Math.round(100*into/XP_PER_LEVEL)};
}
function recordAnswer(topic, correct, verbKey, xpGain){
  var s = STATE.store, tk = todayKey();
  if(s.lastDay !== tk){ s.lastDay = tk; s.today = {correct:0,total:0}; }
  s.today.total++; if(correct) s.today.correct++;
  if(!s.byTopic[topic]) s.byTopic[topic] = {correct:0,total:0};
  s.byTopic[topic].total++; if(correct) s.byTopic[topic].correct++;
  if(verbKey) s.verbsSeen[verbKey] = true;
  s.xp = (s.xp||0) + (xpGain||0);
  saveStore();
  renderSidebarStats();
}
function topicAcc(key){
  var c = STATE.store.byTopic[key];
  if(!c || !c.total) return null;
  return Math.round(100*c.correct/c.total);
}
function getBest(key){ return (STATE.store.best||{})[key] || 0; }
function setBest(key, val){
  if(!STATE.store.best) STATE.store.best = {};
  if(val > (STATE.store.best[key]||0)){ STATE.store.best[key] = val; saveStore(); return true; }
  return false;
}
function renderSidebarStats(){
  var li = levelInfo(), t = STATE.store.today || {correct:0,total:0};

  if((el = document.getElementById("topLevel"))) el.textContent = "Lv " + li.level;

function isAcceptable(value, accept){
  var n = normLoose(value);

  for(var i=0;i<accept.length;i++){ if(normLoose(accept[i]) === n) return true; }

}

function tenseByKey(k){
  for(var i=0;i<TENSES.length;i++){ if(TENSES[i].key===k) return TENSES[i]; }
  return TENSES[0];
}
function verbDistractors(v, tk, pi, correct){
  var pool = [], p;
  for(p=0;p<6;p++){ if(p!==pi) pool.push(cellArr(v.forms[tk][p])[0]); }
  TENSES.forEach(function(t){ if(t.key!==tk) pool.push(cellArr(v.forms[t.key][pi])[0]); });
  var uniq = [], seen = {};
  shuffle(pool).forEach(function(f){
    var n = norm(f);
    if(n !== norm(correct) && !seen[n]){ seen[n] = 1; uniq.push(f); }
  });
  return uniq.slice(0,3);
}
function verbKeysFor(cfg){
  cfg = cfg || {};
  if(cfg.focus && VERBS[cfg.focus]) return [cfg.focus];
  if(cfg.filter === "aux") return ["avoir","etre"];
  var keys = Object.keys(VERBS);
  if(cfg.filter === "exc") keys = keys.filter(function(k){ return Object.keys(VERBS[k].exc).length > 0; });
  return keys;
}

  var cell = v.forms[tk][pi];

/* Typ 1: Jahr nennen. Nur exakte Einträge. */
function buildTimelineYear(){
  var out = [];
  TIMELINE.forEach(function(e){
    if(!e.exact) return;
    out.push(inputQ("g-zeitstrahl", "Jahreszahl",
      "In welchem Jahr: " + e.t + "?",
      "Vierstellige Jahreszahl",
      [String(e.y)], String(e.y), e.d));
  });
  return out;
}

/* Typ 2: Ereignis zuordnen. Distraktoren sind echte Nachbar-Ereignisse —
   dadurch prüft die Frage Unterscheidung statt Ausschluss.
   Ereignisse desselben Jahres scheiden als Distraktor aus: 1891, 1918,
   1919 und 1938 tragen mehrere, und die wären ebenso richtig. */
function buildTimelineEvent(){
  var out = [];
  TIMELINE.forEach(function(e, idx){
    if(!e.exact) return;
    var near = [], i;
    function usable(o){ return o.y !== e.y && near.indexOf(o.t) === -1; }
    for(i = Math.max(0, idx-3); i <= Math.min(TIMELINE.length-1, idx+3); i++){
      if(i !== idx && usable(TIMELINE[i])) near.push(TIMELINE[i].t);
    }
    /* Auffüllen, falls am Rand des Zeitstrahls zu wenige Nachbarn da sind. */
    TIMELINE.forEach(function(o){
      if(near.length < 3 && usable(o)) near.push(o.t);
    });
    var choices = shuffle(near.slice(0,3).concat([e.t]));
    out.push(choiceQ("g-zeitstrahl", "Zuordnen",
      "Was geschah " + e.y + "?", "",
      choices, e.t, e.d));
  });
  return out;
}

/* Typ 3: Reihenfolge. Nahe Paare, weil weit entfernte trivial sind. */
function buildTimelineOrder(){
  var out = [], i, j;
  for(i = 0; i < TIMELINE.length; i++){
    for(j = i+1; j < Math.min(i+4, TIMELINE.length); j++){
      var a = TIMELINE[i], b = TIMELINE[j];
      if(a.y === b.y) continue;            /* gleiches Jahr hat keine Reihenfolge */
      if(!a.exact || !b.exact) continue;   /* unscharf: Reihenfolge nicht belegbar */
      out.push(choiceQ("g-zeitstrahl", "Reihenfolge",
        "Was kam zuerst?", "",
        shuffle([a.t, b.t]), a.t,
        a.t + " (" + a.y + ") kam vor " + b.t + " (" + b.y + ")."));
    }
  }
  return out;
}

var BANK_CACHE = {};
function bankFor(topicKey, setKey){
  var t = topicByKey(topicKey);
  if(!t || t.random) return [];
  var ck = topicKey + "|" + (setKey||"all");
  if(BANK_CACHE[ck]) return BANK_CACHE[ck];
  var out = [];
  t.sets.forEach(function(s){
    if(!setKey || setKey === "all" || setKey === s.key) out = out.concat(s.build());
  });

/* ---------- Fragen-Nachschub ---------- */
function makeFeeder(topicKey, setKey, verbCfg){
  if(topicKey === "verbs"){
    return function(){ return randomVerbQuestion(verbCfg||{}); };
  }
  var bank = shuffle(bankFor(topicKey, setKey)), i = 0;
  return function(){
    if(!bank.length) return null;
    if(i >= bank.length){ bank = shuffle(bank); i = 0; }
    return bank[i++];
  };
}
/* `topics` ist die Themenliste des aktiven Fachs. Ohne sie würde eine
   Geschichts-Session Französisch-Fragen einschleusen. */
function makeMixedFeeder(verbCfg, topics){
  var list = topics || FR_TOPICS;
  var feeders = list.map(function(t){ return makeFeeder(t.key, "all", verbCfg); });
  return function(){
    var f = pick(feeders), q = f();
    if(q) return q;
    for(var i=0;i<feeders.length;i++){ var q2 = feeders[i](); if(q2) return q2; }
    return null;
  };
}
function subjectTopics(cfg){
  var s = subjectByKey(cfg && cfg.subject);
  return s ? s.topics : FR_TOPICS;
}
function buildPool(cfg, count){
  var qs = [], i;
  if(cfg.topic === "all"){
    var list = subjectTopics(cfg);
    var per = Math.ceil((count * 1.5) / list.length);
    list.forEach(function(t){
      var f = makeFeeder(t.key, "all", cfg.verbCfg);
      for(i=0;i<per;i++){ var q = f(); if(q) qs.push(q); }
    });
  } else {
    var f2 = makeFeeder(cfg.topic, cfg.set, cfg.verbCfg);
    for(i=0;i<count*2;i++){ var q2 = f2(); if(q2) qs.push(q2); }
  }
  var seen = {}, out = [];
  shuffle(qs).forEach(function(q){
    var k = q.topic + "|" + q.prompt + "|" + q.display;
    if(!seen[k]){ seen[k] = 1; out.push(q); }
  });
  while(out.length < count && qs.length){ out.push(pick(qs)); }
  return out.slice(0, count);
}

   #/fr/verbs    -> Fach fr, Abschnitt verbs
   #/verbs       -> alte einstufige Route, wird auf Französisch gelesen */
function parseHash(h){
  var raw = (h === undefined ? location.hash : h).replace(/^#\/?/, "");
  if(!raw) return {subject:null, section:"home"};
  var parts = raw.split("/");
  if(parts.length >= 2){
    return subjectByKey(parts[0])
      ? {subject:parts[0], section:parts[1] || "home"}
      : {subject:null, section:"home"};
  }
  /* Einstufig: entweder ein Fach-Schlüssel oder eine alte Französisch-Route. */
  if(subjectByKey(parts[0])) return {subject:parts[0], section:"home"};
  for(var i=0;i<FR_SECTIONS.length;i++){
    if(FR_SECTIONS[i].key === parts[0]) return {subject:"fr", section:parts[0]};
  }
  return {subject:null, section:"home"};
}

  if(!s) return "home";
  for(var i=0;i<s.sections.length;i++){ if(s.sections[i].key === p.section) return p.section; }
  return "home";
}

function initNavDrawer(){
  var btn = document.getElementById("menuBtn"), scrim = document.getElementById("scrim");
  var closeBtn = document.getElementById("drawerClose");
  if(btn) btn.onclick = function(){ if(navIsOpen()) closeNav(); else openNav(); };
  if(scrim) scrim.onclick = closeNav;
  if(closeBtn) closeBtn.onclick = closeNav;
  document.addEventListener("keydown", function(e){
    if((e.key === "Escape" || e.key === "Esc") && navIsOpen()) closeNav();
  });
  /* Beim Wechsel auf Desktopbreite darf kein gesperrter Zustand zurückbleiben. */
  if(window.matchMedia){
    var mq = window.matchMedia("(min-width: 861px)");
    var onWide = function(e){ if(e.matches) closeNav(); };
    if(mq.addEventListener) mq.addEventListener("change", onWide);
    else if(mq.addListener) mq.addListener(onWide);
  }
}

var MODES = {
  round: {key:"round", label:"Runde", count:10},
  blitz: {key:"blitz", label:"Blitz", seconds:60},
  lives: {key:"lives", label:"Herzen", hearts:3},
  test:  {key:"test",  label:"Prüfung", count:20}
};
function comboMult(c){ return c>=10 ? 3 : (c>=6 ? 2 : (c>=3 ? 1.5 : 1)); }

/* Die Übung wird unter der Themenliste eingehängt — auf dem Handy liegt sie
   damit unterhalb des sichtbaren Bereichs. Also hinscrollen, vorbei an der
   klebenden Kopfleiste. */
function scrollHostIntoView(host){
  if(!host) return;
  var bar = document.querySelector(".topbar");
  var offset = (bar && bar.offsetParent !== null) ? bar.getBoundingClientRect().height + 8 : 0;
  var y = host.getBoundingClientRect().top + window.pageYOffset - offset;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top: Math.max(0, y), behavior: reduce ? "auto" : "smooth"});
}

function startSession(host, cfg){
  clearSession();
  var mode = MODES[cfg.mode];
  var sess = {
    host: host, cfg: cfg, mode: mode,
    queue: null, feeder: null, idx: 0,
    correct: 0, total: 0, combo: 0, bestCombo: 0,
    hearts: mode.hearts || 0, xp: 0, answers: [],
    answered: false, q: null, endsAt: null, timerId: null
  };
  if(mode.count) sess.queue = buildPool(cfg, mode.count);
  else sess.feeder = (cfg.topic === "all") ? makeMixedFeeder(cfg.verbCfg, subjectTopics(cfg)) : makeFeeder(cfg.topic, cfg.set, cfg.verbCfg);
  STATE.session = sess;
  if(cfg.mode === "blitz"){
    sess.endsAt = Date.now() + mode.seconds*1000;
    sess.timerId = setInterval(function(){ tickTimer(sess); }, 250);
  }
  nextQuestion(sess);
  scrollHostIntoView(host);
}
function tickTimer(sess){
  var left = Math.max(0, sess.endsAt - Date.now());
  var el = sess.host.querySelector("[data-timer]");
  if(el){
    var s = Math.ceil(left/1000);
    el.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    el.className = "timer mono" + (s <= 10 ? " low" : "");
  }
  var bar = sess.host.querySelector("[data-timerbar]");
  if(bar) bar.style.width = (100*left/(sess.mode.seconds*1000)) + "%";
  if(left <= 0){ clearInterval(sess.timerId); sess.timerId = null; endSession(sess); }
}
function nextQuestion(sess){
  if(sess.mode.hearts && sess.hearts <= 0) return endSession(sess);
  if(sess.queue){
    if(sess.idx >= sess.queue.length) return endSession(sess);
    sess.q = sess.queue[sess.idx];
  } else {
    sess.q = sess.feeder();
    if(!sess.q) return endSession(sess);
  }
  sess.answered = false;
  drawSession(sess);
}
function meterHtml(sess){
  var m = sess.mode, html = '<div class="meter-row">';
  if(m.key === "round" || m.key === "test"){
    var n = sess.idx + 1, tot = sess.queue.length;
    html += '<span class="meter-label">Frage <b class="mono">'+n+'</b> / '+tot+'</span>'
      + '<span class="meter-bar"><i style="width:'+(100*sess.idx/tot)+'%"></i></span>';
    if(m.key === "round") html += '<span class="meter-score mono">'+sess.correct+' richtig</span>';
  } else if(m.key === "blitz"){
    html += '<span class="timer mono" data-timer>1:00</span>'
      + '<span class="meter-bar"><i data-timerbar style="width:100%"></i></span>'
      + '<span class="meter-score mono">'+sess.correct+' richtig</span>';
  } else if(m.key === "lives"){
    html += '<span class="hearts">';
    for(var i=0;i<m.hearts;i++){
      html += '<span class="heart'+(i < sess.hearts ? '' : ' off')+'">'+ICON.heart+'</span>';
    }
    html += '</span><span class="meter-bar" style="visibility:hidden"></span>'
      + '<span class="meter-score mono">'+sess.correct+' richtig</span>';
  }
  if(sess.combo >= 3 && m.key !== "test"){
    html += '<span class="combo-chip">'+ICON.bolt+' ×'+comboMult(sess.combo)+'</span>';
  }
  html += '</div>';
  return html;
}
function drawSession(sess){
  var q = sess.q, m = sess.mode;
  var topicLabel = (topicByKey(q.topic) || {short:""}).short;
  var html = '<div class="quiz-panel">' + meterHtml(sess);
  html += '<div class="q-head"><span class="q-label">'+q.label+'</span>'
        + (sess.cfg.topic === "all" ? '<span class="chip">'+topicLabel+'</span>' : '') + '</div>';
  html += '<div class="quiz-prompt">'+q.prompt+'</div>';
  if(q.hint) html += '<div class="q-hint">'+q.hint+'</div>';
  if(q.kind === "input"){
    html += '<div class="quiz-input-row">'
      + '<input class="quiz-input" id="ansInput" placeholder="Deine Antwort…" autocomplete="off" autocapitalize="off" spellcheck="false">'
      + '<button class="btn accent" id="checkBtn">'+(m.key==="test" ? "Weiter" : "Prüfen")+'</button></div>';
  } else {
    html += '<div class="mc-row">';
    q.choices.forEach(function(c){
      html += '<button class="mc-btn" data-choice="'+String(c).replace(/"/g,"&quot;")+'">'+c+'</button>';
    });
    html += '</div>';
  }
  html += '<div class="feedback" id="fb"></div>';
  html += '<div class="quiz-actions"><button class="link-btn" data-abort>Beenden</button>'
        + '<button class="btn secondary" id="nextBtn" style="display:none;">Weiter →</button></div>';
  html += '</div>';
  sess.host.innerHTML = html;

  var input = document.getElementById("ansInput");
  if(input){
    input.focus();
    document.getElementById("checkBtn").onclick = function(){ submitAnswer(sess, input.value); };
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        if(!input.readOnly) submitAnswer(sess, input.value);
        else { var nb = document.getElementById("nextBtn"); if(nb) nb.click(); }
      }
    });
  }
  sess.host.querySelectorAll("[data-choice]").forEach(function(b){
    b.onclick = function(){ submitAnswer(sess, b.getAttribute("data-choice"), b); };
  });
  var ab = sess.host.querySelector("[data-abort]");
  if(ab) ab.onclick = function(){ endSession(sess); };
  var nb2 = document.getElementById("nextBtn");
  if(nb2) nb2.onclick = function(){ sess.idx++; nextQuestion(sess); };
}
function submitAnswer(sess, value, btn){
  if(sess.answered) return;
  var q = sess.q;
  if(q.kind === "input" && !String(value).trim() && sess.mode.key !== "test") return;
  sess.answered = true;
  var ok = (q.kind === "input") ? isAcceptable(value, q.accept) : (normLoose(value) === normLoose(q.answer));
  sess.total++;
  if(ok){
    sess.correct++; sess.combo++;
    if(sess.combo > sess.bestCombo) sess.bestCombo = sess.combo;
  } else {
    sess.combo = 0;
    if(sess.mode.hearts) sess.hearts--;
  }
  var gain = ok ? Math.round(10 * comboMult(sess.combo)) : 0;
  sess.xp += gain;
  sess.answers.push({q:q, user:value, ok:ok});
  recordAnswer(q.topic, ok, q.vk || null, gain);

  if(sess.mode.key === "test"){
    sess.idx++;
    nextQuestion(sess);
    return;
  }
  var input = document.getElementById("ansInput");
  if(input){ input.classList.add(ok?"correct":"wrong"); input.readOnly = true; input.focus(); }
  var cb = document.getElementById("checkBtn");
  if(cb) cb.style.display = "none";
  sess.host.querySelectorAll(".mc-btn").forEach(function(b){
    b.disabled = true;
    if(normLoose(b.getAttribute("data-choice")) === normLoose(q.answer)) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
  });
  var fb = document.getElementById("fb");
  fb.className = "feedback show " + (ok ? "correct" : "wrong");
  fb.innerHTML = '<div class="fb-head"><span>'+(ok ? "Richtig!" : "Nicht ganz.")+'</span>'
    + (gain ? '<span class="xp-pop mono">+'+gain+' XP</span>' : '') + '</div>'
    + '<div class="answer">'+q.display+'</div>'
    + (q.explain ? '<div class="explain">'+q.explain+'</div>' : '');
  var nb = document.getElementById("nextBtn");
  if(nb){
    nb.style.display = "inline-block";
    nb.textContent = (sess.mode.hearts && sess.hearts <= 0) ? "Ergebnis ansehen →" : "Weiter →";
    nb.focus();
  }
  var sc = sess.host.querySelector(".meter-score");
  if(sc) sc.textContent = sess.correct + " richtig";
}
function stars(pct){
  var n = pct >= 90 ? 3 : (pct >= 70 ? 2 : (pct >= 50 ? 1 : 0));
  var html = '<span class="stars">';
  for(var i=0;i<3;i++) html += '<span class="star'+(i<n?'':' off')+'">'+ICON.star+'</span>';
  return html + '</span>';
}
function endSession(sess){
  if(sess.timerId){ clearInterval(sess.timerId); sess.timerId = null; }
  var pct = sess.total ? Math.round(100*sess.correct/sess.total) : 0;
  var isTest = sess.mode.key === "test";
  var bestKey = sess.mode.key + "|" + sess.cfg.topic;
  var isRecord = false;
  if(sess.mode.key === "blitz" || sess.mode.key === "lives") isRecord = setBest(bestKey, sess.correct);

  var html = '<div class="result-panel">';
  html += '<span class="eyebrow">'+(isTest ? "Prüfungsergebnis" : "Ergebnis")+'</span>';
  html += '<div class="result-top"><div class="result-score mono">'+sess.correct+' / '+sess.total+'</div>'
    + (isTest || sess.mode.key === "round" ? stars(pct) : '') + '</div>';
  html += '<div class="result-meta">'
    + '<span><b class="mono">'+pct+'%</b> richtig</span>'
    + '<span><b class="mono">+'+sess.xp+'</b> XP</span>'
    + '<span>längste Serie <b class="mono">'+sess.bestCombo+'</b></span>'
    + (isRecord ? '<span class="chip gold"><span class="dot"></span>Neuer Rekord</span>' : '')
    + '</div>';

  var byTopic = {};
  sess.answers.forEach(function(a){
    var k = a.q.topic;
    if(!byTopic[k]) byTopic[k] = {c:0,t:0};
    byTopic[k].t++; if(a.ok) byTopic[k].c++;
  });
  var keys = Object.keys(byTopic);
  if(keys.length > 1){
    html += '<div class="result-bars">';
    keys.forEach(function(k){
      var t = topicByKey(k), c = byTopic[k], p = Math.round(100*c.c/c.t);
      html += '<div class="cat-bar-row"><span class="label">'+(t?t.short:k)+'</span>'
        + '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+p+'%"></div></div>'
        + '<span class="frac mono">'+c.c+'/'+c.t+'</span></div>';
    });
    html += '</div>';
  }

  if(isTest && sess.answers.length){
    html += '<div class="section-title" style="margin-top:22px;">Korrektur</div><div class="review-list">';
    sess.answers.forEach(function(a, i){
      html += '<div class="review-item'+(a.ok?' ok':'')+'">'
        + '<div class="ri-num mono">'+(i+1)+'</div>'
        + '<div class="ri-body">'
          + '<div class="ri-prompt">'+a.q.prompt+(a.q.hint?' <span class="muted">— '+a.q.hint.replace(/<[^>]+>/g,"")+'</span>':'')+'</div>'
          + '<div class="ri-answers">'
            + '<span class="ra '+(a.ok?'good':'bad')+'">'+(String(a.user).trim() ? a.user : "—")+'</span>'
            + (a.ok ? '' : '<span class="ra good">'+a.q.display+'</span>')
          + '</div>'
          + (a.ok || !a.q.explain ? '' : '<div class="ri-explain">'+a.q.explain+'</div>')
        + '</div></div>';
    });
    html += '</div>';
  }

  html += '<div class="result-actions">'
    + '<button class="btn accent" data-again>Nochmal</button>'
    + '<button class="btn secondary" data-back>Zur Auswahl</button>'
    + '</div></div>';
  sess.host.innerHTML = html;
  sess.host.querySelector("[data-again]").onclick = function(){ startSession(sess.host, sess.cfg); };
  sess.host.querySelector("[data-back]").onclick = function(){ clearSession(); sess.cfg.back(); };
  STATE.session = null;
}

}

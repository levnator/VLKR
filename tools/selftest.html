<!doctype html>
<meta charset="utf-8">
<title>VLKR Selbsttest</title>
<style>body{font:13px ui-monospace,monospace;margin:12px}iframe{width:390px;height:700px;border:1px solid #ccc}</style>
<iframe id="app" src="../index.html"></iframe>
<pre id="results">läuft…</pre>
<script>
var results = [], fails = 0;
function check(name, fn){
  try{
    var r = fn();
    if(r === true){ results.push("PASS  " + name); }
    else { fails++; results.push("FAIL  " + name + " — " + r); }
  }catch(e){ fails++; results.push("FAIL  " + name + " — " + e.message); }
}
/* Tasks 9–14 haben dieselbe Form: Bank gefüllt, jede Frage vollständig,
   kein Thema fremd, jede Auswahlfrage enthält ihre eigene Antwort. */
function bankCheck(T, key, min){
  check("Thema " + key + ": Bank gefüllt und sauber", function(){
    var bank = T.bankFor(key, "all");
    if(bank.length < min) return "nur " + bank.length + " Fragen, mindestens " + min + " erwartet";
    for(var i=0;i<bank.length;i++){
      var q = bank[i];
      if(q.topic !== key) return "Frage " + i + " trägt fremdes Thema " + q.topic;
      if(!q.prompt) return "Frage " + i + " ohne Fragetext";
      if(!q.explain) return "Frage " + i + " ohne Erklärung";
      if(q.kind === "input"){
        if(!q.accept || !q.accept.length || !q.accept[0]) return "Frage " + i + " ohne Antwort";
      } else {
        if(!q.answer) return "Frage " + i + " ohne Antwort";
        if(q.choices.indexOf(q.answer) === -1) return "Frage " + i + " ohne richtige Option";
        if(q.choices.length < 2) return "Frage " + i + " mit weniger als zwei Optionen";
      }
    }
    return true;
  });
  check("Thema " + key + ": Referenz und Lede vorhanden", function(){
    if(typeof T.REFERENCE[key] !== "function") return "REFERENCE fehlt";
    if(!T.TOPIC_LEDE[key]) return "TOPIC_LEDE fehlt";
    return true;
  });
}
function runChecks(W, T){
  check("Testzugang vorhanden", function(){
    return T ? true : "window.__VLKR_TEST__ fehlt";
  });
  check("Französisch hat 9 Themen", function(){
    var t = T.topicsOf("fr");
    return (t && t.length === 9) ? true : "erwartet 9, ist " + (t ? t.length : "null");
  });
  /* Fortschritt hängt an STORE_KEY und den Themenschlüsseln. Ändert sich
     eines davon, ist der bestehende Französisch-Stand verloren. */
  check("Speicherschlüssel unverändert", function(){
    return T.STORE_KEY === "cahier_progress_v2" ? true : "ist " + T.STORE_KEY;
  });
  check("Französische Themenschlüssel unverändert", function(){
    var k = T.topicsOf("fr").map(function(t){ return t.key; }).join(",");
    return k.indexOf("verbs,gender,adj,place,comp,etre") === 0 ? true : "ist " + k;
  });

  /* ---- Verbliste 24–33 ---- */
  check("26 Verben in der Bibel", function(){
    return Object.keys(T.VERBS).length === 26 ? true : "ist " + Object.keys(T.VERBS).length;
  });
  check("Die zehn neuen Verben sind da", function(){
    var neu = ["dormir","mentir","servir","venir","tenir","cueillir","offrir","mourir","conquerir","bouillir"];
    var fehlt = neu.filter(function(k){ return !T.VERBS[k]; });
    return fehlt.length === 0 ? true : "fehlt: " + fehlt.join(", ");
  });
  check("Jedes Verb hat 6 Zeiten à 6 Personen", function(){
    var tk = ["pr","im","pc","pq","fu","co"], bad = [];
    Object.keys(T.VERBS).forEach(function(k){
      var f = T.VERBS[k].forms;
      tk.forEach(function(t){
        if(!f[t] || f[t].length !== 6) bad.push(k + "." + t);
        else f[t].forEach(function(cell, i){
          var arr = Array.isArray(cell) ? cell : [cell];
          if(!arr.length || arr.some(function(x){ return !x || !String(x).trim(); })) bad.push(k+"."+t+"["+i+"]");
        });
      });
    });
    return bad.length === 0 ? true : "unvollständig: " + bad.slice(0,5).join(", ");
  });
  check("Jedes Verb steht in genau einer Gruppe", function(){
    var seen = {}, doppelt = [], fehlt = [];
    T.VERB_GROUPS.forEach(function(g){
      g.verbs.forEach(function(v){
        if(!T.VERBS[v]) fehlt.push(v);
        if(seen[v]) doppelt.push(v);
        seen[v] = 1;
      });
    });
    var ohne = Object.keys(T.VERBS).filter(function(k){ return !seen[k]; });
    if(fehlt.length) return "Gruppe nennt unbekanntes Verb: " + fehlt.join(", ");
    if(doppelt.length) return "doppelt gruppiert: " + doppelt.join(", ");
    return ohne.length === 0 ? true : "ohne Gruppe: " + ohne.join(", ");
  });
  /* venir und mourir bilden das Passé composé mit être — sie stehen in
     ETRE_PAIRS und müssen es auch in der Konjugation tun. */
  check("venir und mourir konjugieren mit être", function(){
    var bad = ["venir","mourir"].filter(function(k){
      var c = T.VERBS[k].forms.pc[0];
      return String(Array.isArray(c) ? c[0] : c).indexOf("suis ") !== 0;
    });
    return bad.length === 0 ? true : "mit avoir gebildet: " + bad.join(", ");
  });
  check("tenir konjugiert mit avoir", function(){
    var c = T.VERBS.tenir.forms.pc[0];
    return String(Array.isArray(c) ? c[0] : c).indexOf("ai ") === 0 ? true : "ist " + c;
  });

  /* ---- Task 2: SUBJECTS-Register ---- */
  check("Drei Fächer registriert", function(){
    return T.SUBJECTS.length === 3 ? true : "erwartet 3, ist " + T.SUBJECTS.length;
  });
  check("Fach-Schlüssel sind fr, ge und pkm", function(){
    var k = T.SUBJECTS.map(function(s){ return s.key; }).join(",");
    return k === "fr,ge,pkm" ? true : "ist " + k;
  });
  check("Geschichte hat 7 Themen", function(){
    var t = T.topicsOf("ge");
    return (t && t.length === 7) ? true : "erwartet 7, ist " + (t ? t.length : "null");
  });
  check("Alle Geschichts-Schlüssel mit g- präfixiert", function(){
    var bad = T.topicsOf("ge").filter(function(t){ return t.key.indexOf("g-") !== 0; });
    return bad.length === 0 ? true : "ohne Präfix: " + bad.map(function(t){return t.key;}).join(",");
  });

  /* ---- Task 3: zweistufiges Routing ---- */
  check("Hash #/fr/verbs wird korrekt zerlegt", function(){
    var p = T.parseHash("#/fr/verbs");
    return (p.subject === "fr" && p.section === "verbs") ? true : JSON.stringify(p);
  });
  check("Leerer Hash ergibt Fach-Wahl", function(){
    var p = T.parseHash("#/");
    return (p.subject === null) ? true : JSON.stringify(p);
  });
  check("Alte Route #/verbs zeigt auf Französisch", function(){
    var p = T.parseHash("#/verbs");
    return (p.subject === "fr" && p.section === "verbs") ? true : JSON.stringify(p);
  });
  check("Alte Route #/home zeigt auf Französisch", function(){
    var p = T.parseHash("#/home");
    return (p.subject === "fr" && p.section === "home") ? true : JSON.stringify(p);
  });
  check("Unbekanntes Fach ergibt Fach-Wahl", function(){
    var p = T.parseHash("#/xx/verbs");
    return (p.subject === null) ? true : JSON.stringify(p);
  });

  /* ---- Task 4: Fach-Wahl ---- */
  check("Fortschritt je Fach zählt nur eigene Themen", function(){
    var p = T.subjectProgress("ge");
    return (p.total === 7) ? true : "erwartet total 7, ist " + p.total;
  });

  /* ---- Task 5: keine Fach-Vermischung ---- */
  check("Prüfungspool Geschichte enthält keine Französisch-Fragen", function(){
    var frKeys = T.topicsOf("fr").map(function(t){ return t.key; });
    var pool = T.buildPool({subject:"ge", topic:"all", set:"all", verbCfg:{}}, 20);
    var bad = pool.filter(function(q){ return frKeys.indexOf(q.topic) !== -1; });
    return bad.length === 0 ? true : bad.length + " Fremdfragen, erste: " + bad[0].topic;
  });
  check("Prüfungspool Französisch enthält keine Geschichts-Fragen", function(){
    var pool = T.buildPool({subject:"fr", topic:"all", set:"all", verbCfg:{}}, 20);
    var bad = pool.filter(function(q){ return q.topic.indexOf("g-") === 0; });
    return bad.length === 0 ? true : bad.length + " Fremdfragen";
  });

  /* ---- Task 6: Zeitstrahl-Daten ---- */
  check("Zeitstrahl hat 26 Einträge", function(){
    return T.TIMELINE.length === 26 ? true : "ist " + T.TIMELINE.length;
  });
  check("Davon 23 mit exaktem Jahr", function(){
    var n = T.TIMELINE.filter(function(e){ return e.exact; }).length;
    return n === 23 ? true : "ist " + n;
  });
  check("Zeitstrahl ist chronologisch sortiert", function(){
    for(var i=1;i<T.TIMELINE.length;i++){
      if(T.TIMELINE[i].y < T.TIMELINE[i-1].y) return "Bruch bei Index " + i;
    }
    return true;
  });
  check("Jeder Eintrag hat Titel, Beschreibung und gültiges Thema", function(){
    var keys = T.topicsOf("ge").map(function(t){ return t.key; });
    for(var i=0;i<T.TIMELINE.length;i++){
      var e = T.TIMELINE[i];
      if(!e.t || !e.d) return "Index " + i + " unvollständig";
      if(keys.indexOf(e.topic) === -1) return "Index " + i + " hat unbekanntes Thema " + e.topic;
    }
    return true;
  });

  /* ---- Task 7: Zeitstrahl-Drill ---- */
  /* Ohne diese Prüfung würden die Invarianten unten auf leeren Bänken
     stillschweigend bestehen. */
  check("Die drei Zeitstrahl-Bänke sind gefüllt", function(){
    var n = ["year","event","order"].map(function(s){ return T.bankFor("g-zeitstrahl", s).length; });
    return (n[0] === 23 && n[1] === 23 && n[2] > 20)
      ? true : "year=" + n[0] + " event=" + n[1] + " order=" + n[2];
  });
  check("Jahresfragen nur aus exakten Einträgen", function(){
    var bank = T.bankFor("g-zeitstrahl", "year");
    var fuzzy = T.TIMELINE.filter(function(e){ return !e.exact; })
                          .map(function(e){ return e.t; });
    var bad = bank.filter(function(q){
      return fuzzy.some(function(t){ return q.prompt.indexOf(t) !== -1; });
    });
    return bad.length === 0 ? true : "unscharfer Eintrag in Frage: " + bad[0].prompt;
  });
  check("Jahresfragen akzeptieren die reine Jahreszahl", function(){
    var bank = T.bankFor("g-zeitstrahl", "year");
    var bad = bank.filter(function(q){ return !/^\d{4}$/.test(q.accept[0]); });
    return bad.length === 0 ? true : "unerwartete Antwort: " + bad[0].accept[0];
  });
  check("Zuordnungsfragen haben vier verschiedene Optionen", function(){
    var bank = T.bankFor("g-zeitstrahl", "event");
    var bad = bank.filter(function(q){
      var u = {}; q.choices.forEach(function(c){ u[c] = 1; });
      return q.choices.length !== 4 || Object.keys(u).length !== 4;
    });
    return bad.length === 0 ? true : bad.length + " Fragen mit doppelten Optionen";
  });
  check("Zuordnungsfragen enthalten ihre eigene Antwort", function(){
    var bank = T.bankFor("g-zeitstrahl", "event");
    var bad = bank.filter(function(q){ return q.choices.indexOf(q.answer) === -1; });
    return bad.length === 0 ? true : bad.length + " Fragen ohne richtige Option";
  });
  /* Die Jahre 1891, 1918, 1919 und 1938 tragen mehrere Ereignisse. Stünden
     zwei davon in derselben Frage, gäbe es zwei richtige Antworten. */
  check("Zuordnungsfragen haben nur eine richtige Antwort", function(){
    var byYear = {};
    T.TIMELINE.forEach(function(e){ (byYear[e.y] = byYear[e.y] || []).push(e.t); });
    var bank = T.bankFor("g-zeitstrahl", "event");
    for(var i=0;i<bank.length;i++){
      var q = bank[i];
      var y = (q.prompt.match(/\d{4}/) || [])[0];
      var same = byYear[y] || [];
      var hits = q.choices.filter(function(c){ return same.indexOf(c) !== -1; });
      if(hits.length !== 1) return q.prompt + " hat " + hits.length + " richtige Optionen: " + hits.join(" / ");
    }
    return true;
  });
  check("Reihenfolge-Fragen nutzen unterschiedliche Jahre", function(){
    var bank = T.bankFor("g-zeitstrahl", "order");
    return bank.length > 0 ? true : "Bank ist leer";
  });

  /* ---- Task 8: Zahlen und Sonderbund ---- */
  check("Zahlen-Bank enthält die Kernquoren", function(){
    var bank = T.bankFor("g-volksrechte", "zahlen");
    var joined = bank.map(function(q){ return q.display; }).join("|");
    var need = ["100'000", "18 Monate", "50'000", "100 Tage"];
    var missing = need.filter(function(v){ return joined.indexOf(v) === -1; });
    return missing.length === 0 ? true : "fehlt: " + missing.join(", ");
  });
  check("Acht Sonderbund-Kantone", function(){
    var bank = T.bankFor("g-1848", "sonderbund");
    return bank.length >= 8 ? true : "nur " + bank.length + " Fragen";
  });

  /* ---- Tasks 9–14: Inhaltsthemen ---- */
  /* ---- Baukasten 3D ---- */
  check("Baukasten: jede Zerlegung ergibt wieder die Form", function(){
    var bad = [];
    Object.keys(T.VERBS).forEach(function(k){
      ["pr","im","pc","pq","fu","co"].forEach(function(t){
        for(var i=0;i<6;i++){
          var c = T.VERBS[k].forms[t][i], f = Array.isArray(c) ? c[0] : c;
          var s = T.atelierSplit(k, t, i);
          var back = s.aux ? s.aux + " " + s.stem : s.stem + s.end;
          if(back !== f) bad.push(k+"."+t+"["+i+"]="+back);
        }
      });
    });
    return bad.length === 0 ? true : bad.slice(0,5).join(", ");
  });
  check("Baukasten: Stamm und Endung stimmen", function(){
    var cases = [["parler","pr",3,"parl","ons"],["finir","pr",0,"fin","is"],["finir","pr",3,"fin","issons"],
                 ["dormir","pr",2,"dor","t"],["parler","fu",0,"parler","ai"],["venir","co",5,"viendr","aient"],
                 ["parler","im",4,"parl","iez"]];
    for(var i=0;i<cases.length;i++){
      var c = cases[i], s = T.atelierSplit(c[0], c[1], c[2]);
      if(s.stem !== c[3] || s.end !== c[4]) return c.join("/") + " ergab " + s.stem + "+" + s.end;
    }
    var pc = T.atelierSplit("venir","pc",0);
    return pc.aux === "suis" ? true : "venir pc: " + pc.aux;
  });
  bankCheck(T, "poss", 50);
  bankCheck(T, "neg", 50);
  bankCheck(T, "voc", 250);
  check("Vokabeln: 133 Wörter auf vier Seiten", function(){
    var n = T.VOC_PAGES.reduce(function(a,p){ return a + p.words.length; }, 0);
    return n === 133 ? true : "ist " + n;
  });
  bankCheck(T, "g-zeitstrahl", 23);
  bankCheck(T, "g-1848", 24);
  bankCheck(T, "g-demokratie", 18);
  bankCheck(T, "g-volksrechte", 24);
  bankCheck(T, "g-initiative", 14);
  bankCheck(T, "g-weltkrieg", 20);
  bankCheck(T, "g-staatslehre", 16);

  /* Jedes Geschichts-Thema muss spielbar sein. */
  check("Jedes Geschichts-Thema hat mindestens ein Set", function(){
    var leer = T.topicsOf("ge").filter(function(t){ return !t.sets || !t.sets.length; });
    return leer.length === 0 ? true : "ohne Set: " + leer.map(function(t){return t.key;}).join(",");
  });

  /* ---- Task 15: Darstellung ---- */
  check("Kein horizontaler Überlauf im Iframe", function(){
    var d = W.document;
    return d.documentElement.scrollWidth <= W.innerWidth + 1
      ? true
      : "scrollWidth " + d.documentElement.scrollWidth + " > " + W.innerWidth;
  });
}

/* Das Pokémon-Modul hängt am Netz. Statt wirklich zu laden, wird pkmFetch
   durch Fixtures ersetzt — so lassen sich Bänke und Bildpfade prüfen,
   ohne von einer fremden API abzuhängen. */
function pkmFixture(){
  function card(i, name, preis){
    return {id:"me05-"+i, localId:String(i), name:name,
            image:"https://assets.tcgdex.net/en/me/me05/"+i,
            pricing:{cardmarket:{unit:"EUR", trend:preis, avg:preis, low:preis/2}}};
  }
  var namen = ["Mega Darkrai ex","Mega Zeraora ex","Mega Chandelure ex","Mega Excadrill ex",
               "Mega Delphox ex","Mega Slowbro ex","Zorua","Sableye","Houndour","Murkrow"];
  var karten = namen.map(function(n, i){ return card(i+1, n, (i+1) * 3.5); });
  var byId = {};
  karten.forEach(function(c){ byId[c.id] = c; });
  return function(url){
    if(/\/sets$/.test(url)){
      return Promise.resolve([
        {id:"me05", name:"Pitch Black", cardCount:{total:120}},
        {id:"me05tg", name:"Pitch Black Trainer Gallery", cardCount:{total:12}},
        {id:"me03", name:"Ascended Heroes", cardCount:{total:295}}
      ]);
    }
    var m = url.match(/\/sets\/([^/?]+)$/);
    if(m) return Promise.resolve({id:m[1], name:m[1]==="me03"?"Ascended Heroes":"Pitch Black", cards:karten});
    var c = url.match(/\/cards\/([^/?]+)$/);
    if(c && byId[c[1]]) return Promise.resolve(byId[c[1]]);
    return Promise.reject(new Error("Fixture kennt " + url + " nicht"));
  };
}

function runPkmChecks(T, done){
  check("Pokémon ist als drittes Fach registriert", function(){
    var s = T.SUBJECTS[2];
    return (s && s.key === "pkm" && s.topics.length === 2)
      ? true : "ist " + (s ? s.key + "/" + s.topics.length : "nichts");
  });
  check("Pokémon-Themenschlüssel tragen das Präfix p-", function(){
    var bad = T.topicsOf("pkm").filter(function(t){ return t.key.indexOf("p-") !== 0; });
    return bad.length === 0 ? true : bad.map(function(t){return t.key;}).join(",");
  });
  check("Zwei Sets zur Wahl: Ascended Heroes und Pitch Black", function(){
    var k = T.PKM_SETS.map(function(s){ return s.label; }).join(" / ");
    return k === "Ascended Heroes / Pitch Black" ? true : "ist " + k;
  });
  /* Ein Name kann auf mehrere Einträge passen — die Hauptedition hat die
     meisten Karten und muss gewinnen. */
  check("Set-Erkennung wählt die Hauptedition, nicht die Unterserie", function(){
    var liste = [{id:"me05tg", name:"Pitch Black Trainer Gallery", cardCount:{total:12}},
                 {id:"me05", name:"Pitch Black", cardCount:{total:120}}];
    var hit = T.pkmPickSet(liste, T.PKM_SETS[1]);
    return (hit && hit.id === "me05") ? true : "gewählt: " + (hit ? hit.id : "nichts");
  });
  check("Bild-URL bekommt Qualität und Endung", function(){
    var u = T.pkmImg({img:"https://assets.tcgdex.net/en/me/me05/7"}, "high");
    return u === "https://assets.tcgdex.net/en/me/me05/7/high.webp" ? true : "ist " + u;
  });
  check("Preise werden als Euro mit Komma gesetzt", function(){
    return T.pkmEuro(218.5) === "218,50 €" ? true : "ist " + T.pkmEuro(218.5);
  });

  T.pkmReset();
  T.setPkmFetch(pkmFixture());
  T.pkmPreparePrices().then(function(){
    check("Artwork-Bank ist gefüllt und spoilerfrei", function(){
      var bank = T.bankFor("p-artwork", "all");
      if(bank.length < 10) return "nur " + bank.length + " Fragen";
      for(var i=0;i<bank.length;i++){
        var q = bank[i];
        if(q.choices.length !== 4) return "Frage " + i + " hat " + q.choices.length + " Optionen";
        if(q.choices.indexOf(q.answer) === -1) return "Frage " + i + " ohne richtige Option";
        var u = {}; q.choices.forEach(function(c){ u[c] = 1; });
        if(Object.keys(u).length !== 4) return "Frage " + i + " hat doppelte Optionen";
        /* Der Kartenname darf nicht im Fragetext stehen. */
        if(q.prompt.indexOf(q.answer) !== -1) return "Frage " + i + " verrät die Antwort im Prompt";
        if(q.prompt.indexOf("pk-art") === -1) return "Frage " + i + " zeigt keinen Bildausschnitt";
      }
      return true;
    });
    check("Preis-Bank nutzt nur echte Preise als Distraktoren", function(){
      var bank = T.bankFor("p-preis", "all");
      if(bank.length < 4) return "nur " + bank.length + " Fragen";
      var echt = {};
      for(var i=1;i<=10;i++) echt[T.pkmEuro(i*3.5)] = 1;
      for(var j=0;j<bank.length;j++){
        var q = bank[j];
        if(q.choices.indexOf(q.answer) === -1) return "Frage " + j + " ohne richtige Option";
        var fremd = q.choices.filter(function(c){ return !echt[c]; });
        if(fremd.length) return "erfundener Preis: " + fremd.join(", ");
        var u = {}; q.choices.forEach(function(c){ u[c] = 1; });
        if(Object.keys(u).length !== q.choices.length) return "Frage " + j + " hat doppelte Preise";
      }
      return true;
    });
    /* Die Fixture kennt nur TCGdex-Antworten. Weil die Pokémon-TCG-API
       zuerst gefragt wird, beweist ein TCGdex-Ergebnis das Durchfallen. */
    check("Fällt auf die zweite Quelle durch, wenn die erste nichts liefert", function(){
      var src = T.pkmSourceOf("pitch-black") || T.pkmSourceOf("ascended-heroes");
      return src === "tcgdex" ? true : "Quelle war " + src;
    });
    check("Prüfung Pokémon zieht keine Fragen aus anderen Fächern", function(){
      var pool = T.buildPool({subject:"pkm", topic:"all", set:"all", verbCfg:{}}, 20);
      if(!pool.length) return "Pool ist leer";
      var bad = pool.filter(function(q){ return q.topic.indexOf("p-") !== 0; });
      return bad.length === 0 ? true : bad.length + " Fremdfragen, erste: " + bad[0].topic;
    });
    runFallbackCheck(T, done);
  })["catch"](function(e){
    check("Pokémon-Daten laden mit Fixtures", function(){ return "Fehler: " + e.message; });
    done();
  });
}

/* Die Pokémon-TCG-API ist die erste Quelle: sie liefert Karten, Bilder
   und Cardmarket-Preis in einem Zug. Die Set-Suche läuft ohne `q`, weil
   `q=name:"Ascended Heroes"` dort live HTTP 500 ergab. */
function runFallbackCheck(T, done){
  T.pkmReset();
  T.setPkmFetch(function(url){
    if(url.indexOf("tcgdex") !== -1) return Promise.reject(new TypeError("Failed to fetch"));
    /* Die Abfrage darf keinen q-Parameter für den Setnamen tragen. */
    if(/\/sets\?/.test(url)){
      if(/[?&]q=/.test(url)) return Promise.reject(new Error("HTTP 500 für " + url));
      return Promise.resolve({data:[
        {id:"me05tg", name:"Pitch Black Trainer Gallery", total:12},
        {id:"me05", name:"Pitch Black", total:120},
        {id:"me03", name:"Ascended Heroes", total:295}
      ]});
    }
    if(/\/cards\?/.test(url)){
      var rows = [];
      for(var i=1;i<=12;i++){
        rows.push({id:"me05-"+i, name:"Karte "+i, number:String(i),
          images:{small:"https://images.pokemontcg.io/me05/"+i+".png",
                  large:"https://images.pokemontcg.io/me05/"+i+"_hires.png"},
          cardmarket:{prices:{trendPrice: i * 4.25}}});
      }
      return Promise.resolve({data:rows});
    }
    return Promise.reject(new Error("Fixture kennt " + url + " nicht"));
  });

  T.pkmPreparePrices().then(function(){
    check("Pokémon-TCG-API liefert das Set ohne q-Parameter", function(){
      if(T.pkmSourceOf("ascended-heroes") !== "ptcg" && T.pkmSourceOf("pitch-black") !== "ptcg")
        return "Quelle war nicht ptcg";
      var bank = T.bankFor("p-artwork", "all");
      return bank.length >= 12 ? true : "nur " + bank.length + " Fragen";
    });
    check("Preise der Pokémon-TCG-API kommen ohne Extra-Anfragen mit", function(){
      var bank = T.bankFor("p-preis", "all");
      if(bank.length < 4) return "nur " + bank.length + " Fragen";
      var echt = {};
      for(var i=1;i<=12;i++) echt[T.pkmEuro(i*4.25)] = 1;
      for(var j=0;j<bank.length;j++){
        var fremd = bank[j].choices.filter(function(c){ return !echt[c]; });
        if(fremd.length) return "erfundener Preis: " + fremd.join(", ");
      }
      return true;
    });
    /* Die Diagnose muss die drei Fälle sauber trennen, sonst schickt sie
       den Nutzer auf die falsche Fährte. */
    check("Diagnose erkennt CORS: Bilder laden, Daten nicht", function(){
      var v = T.pkmVerdict({bildPtcg:true, bildTcgdex:true,
                            apiPtcg:"nicht erreichbar", apiTcgdex:"nicht erreichbar"});
      return v.kind === "cors" ? true : "sagt " + v.kind;
    });
    check("Diagnose erkennt Blockade: gar nichts kommt durch", function(){
      var v = T.pkmVerdict({bildPtcg:false, bildTcgdex:false,
                            apiPtcg:"nicht erreichbar", apiTcgdex:"nicht erreichbar"});
      return v.kind === "blocked" ? true : "sagt " + v.kind;
    });
    check("Diagnose erkennt, wenn es doch geht", function(){
      var v = T.pkmVerdict({bildPtcg:true, bildTcgdex:false,
                            apiPtcg:"ok", apiTcgdex:"nicht erreichbar"});
      return v.kind === "ok" ? true : "sagt " + v.kind;
    });
    check("Ein HTTP-Fehler gilt nicht als Erfolg", function(){
      var v = T.pkmVerdict({bildPtcg:true, bildTcgdex:true,
                            apiPtcg:"HTTP 500", apiTcgdex:"HTTP 404"});
      return v.kind !== "ok" ? true : "sagt " + v.kind;
    });
    /* Genau der Fall vom Livesystem: ein lesbarer Status beweist, dass die
       Antwort ankam — dann darf die Diagnose nicht CORS behaupten. */
    check("Lesbarer HTTP-Status schliesst CORS aus", function(){
      var v = T.pkmVerdict({bildPtcg:true, bildTcgdex:false,
                            apiPtcg:"HTTP 500", apiTcgdex:"nicht erreichbar"});
      return v.kind === "server" ? true : "sagt " + v.kind;
    });
    check("CORS nur, wenn keine einzige Antwort ankam", function(){
      var v = T.pkmVerdict({bildPtcg:true, bildTcgdex:true,
                            apiPtcg:"nicht erreichbar", apiTcgdex:"nicht erreichbar"});
      return v.kind === "cors" ? true : "sagt " + v.kind;
    });
    check("Fertige Bild-URLs bleiben unverändert", function(){
      var u = T.pkmImg({imgHi:"https://images.pokemontcg.io/me05/3_hires.png",
                        imgLo:"https://images.pokemontcg.io/me05/3.png"}, "high");
      return u === "https://images.pokemontcg.io/me05/3_hires.png" ? true : "ist " + u;
    });
    done();
  })["catch"](function(e){
    check("Pokémon-TCG-API liefert das Set ohne q-Parameter", function(){
      return "Fehler: " + e.message;
    });
    done();
  });
}

/* Jede Seite beider Fächer einmal öffnen: Überlauf messen und jeden
   Skriptfehler im Iframe einsammeln. */
function runRouteChecks(W, T, done){
  var routes = ["#/"], errs = [];
  T.SUBJECTS.forEach(function(s){
    routes.push("#/" + s.key + "/home");
    s.sections.forEach(function(sec){ routes.push("#/" + s.key + "/" + sec.key); });
  });
  W.addEventListener("error", function(e){ errs.push(W.location.hash + ": " + e.message); });
  var overflow = [], i = 0;
  (function step(){
    if(i >= routes.length){
      check("Keine Skriptfehler beim Durchgang durch alle Seiten", function(){
        return errs.length === 0 ? true : errs.join(" | ");
      });
      check("Keine Seite läuft bei 390 px horizontal über", function(){
        return overflow.length === 0 ? true : overflow.join(", ");
      });
      done();
      return;
    }
    var r = routes[i++];
    W.location.hash = r;
    setTimeout(function(){
      var sw = W.document.documentElement.scrollWidth;
      if(sw > W.innerWidth + 1) overflow.push(r + " (" + sw + "px)");
      step();
    }, 60);
  })();
}
document.getElementById("app").addEventListener("load", function(){
  var W = this.contentWindow;
  setTimeout(function(){
    var T = W.__VLKR_TEST__;
    runChecks(W, T);
    runPkmChecks(T, function(){
      runRouteChecks(W, T, function(){
        results.push(fails ? ("\n" + fails + " FEHLER") : "\nALL PASS");
        document.getElementById("results").textContent = results.join("\n");
      });
    });
  }, 500);
});
window.addEventListener("error", function(e){
  fails++;
  document.getElementById("results").textContent = "FAIL  Skriptfehler — " + e.message;
});
</script>
